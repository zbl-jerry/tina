name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the previous run, on a pull request and on dev alike:
# after several merges only the newest head is worth building. A cancelled run
# is not a pass, so read the newest run for the pushed head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The app build stays independent of both test executables.
  build:
    name: Build & selftest
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Tina --selftest

      # Packaging is a release check, not a PR check. Keeping it on dev still
      # exercises Tools/make-dmg.sh without sitting in every PR's path.
      - name: Package DMG
        if: github.event_name != 'pull_request'
        run: ./Tools/make-dmg.sh

  # Compile each toolchain's tests once. Shards download that run's executable
  # (not a cross-commit cache), then start without waiting for the app build.
  test_build:
    name: Primary test executable
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Compile test executable
        run: ./build.sh --test-build-only

      - name: Package same-run test executable
        run: python3 Tests/ci_test_shard.py pack test-executable.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: test-executable-primary-${{ github.run_attempt }}
          path: test-executable.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  test_shards:
    name: Primary tests (${{ matrix.shard }}/2)
    needs: test_build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.test_build.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.test_build.outputs.artifact-id }}
          path: test-artifact
          digest-mismatch: error

      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 Tests/ci_test_shard.py run test-artifact/test-executable.tar.gz "$SHARD"

      - name: Run shell contracts once
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: ./build.sh --test-shell-only

  test:
    name: Unit tests
    needs: [test_build, test_shards]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both test shards
        env:
          BUILT: ${{ needs.test_build.result }}
          TESTED: ${{ needs.test_shards.result }}
        run: test "$BUILT" = success && test "$TESTED" = success

  # Keep the same old-toolchain coverage on dev and manual runs. The app build
  # and test compilation are independent rather than two serial Swift builds.
  compatibility_build:
    name: Swift 6.0.3 build & selftest
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Tina --selftest

  compatibility_test_build:
    name: Swift 6.0.3 test executable
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Compile test executable
        run: ./build.sh --test-build-only

      - name: Package same-run test executable
        run: python3 Tests/ci_test_shard.py pack test-executable.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: test-executable-swift-6-0-3-${{ github.run_attempt }}
          path: test-executable.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compatibility_test_shards:
    name: Swift 6.0.3 tests (${{ matrix.shard }}/2)
    needs: compatibility_test_build
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.compatibility_test_build.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.compatibility_test_build.outputs.artifact-id }}
          path: test-artifact
          digest-mismatch: error

      - name: Run test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 Tests/ci_test_shard.py run test-artifact/test-executable.tar.gz "$SHARD"

      - name: Run shell contracts once
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: ./build.sh --test-shell-only

  compatibility:
    name: Swift 6.0.3 compatibility
    needs: [compatibility_build, compatibility_test_build, compatibility_test_shards]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the compatibility build and both test shards
        env:
          BUILT: ${{ needs.compatibility_build.result }}
          TEST_BINARY: ${{ needs.compatibility_test_build.result }}
          TESTED: ${{ needs.compatibility_test_shards.result }}
        run: test "$BUILT" = success && test "$TEST_BINARY" = success && test "$TESTED" = success
