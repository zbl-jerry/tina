name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the previous run, on a pull request and on dev alike:
# after several merges only the newest head is worth building. A cancelled run
# is not a pass, so read the newest run for the pushed head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build and tests are separate jobs so a PR waits for the slower one rather
  # than for their sum. Each job compiles what it needs; the test job builds
  # its own binary from the same sources, so no artifact is shared.
  build:
    name: Build & selftest
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Tina --selftest

      # Packaging is a release check, not a PR check. Keeping it on dev still
      # exercises Tools/make-dmg.sh without sitting in every PR's path.
      - name: Package DMG
        if: github.event_name != 'pull_request'
        run: ./Tools/make-dmg.sh

  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Unit tests
        run: ./build.sh --test

  # The older toolchain is checked when dev advances and on demand. PRs are
  # already compiled and tested on the primary toolchain; repeating the whole
  # suite under this one doubled every PR's runner cost.
  compatibility:
    name: Swift 6.0.3 compatibility
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Tina --selftest

      - name: Unit tests
        run: ./build.sh --test
