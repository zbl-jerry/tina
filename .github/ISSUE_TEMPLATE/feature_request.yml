name: "✨ 功能需求"
description: 为 Tina 建议新功能或改进
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        **这个需求可能已经有人提过了。** 提交前请先搜索
        [已有 issue](https://github.com/zbl-jerry/tina/issues?q=is%3Aissue)，
        并在相同的需求下评论、点 👍，而不是再开一个重复的 issue，这样投票会集中在一处。

        如果这个需求来自开源项目调研，建议先用仓库内的
        `/tina-feature-research` skill 做约束检查和价值分析。它会核对
        macOS 15、原生实现、上游 Release 包 ≤30 MB（没有 release 则跳过）、
        复杂度、与现有功能重复性，并生成下面的字段和“开源参考”内容。
        只借鉴产品行为，代码按 Tina 架构重写。

  - type: textarea
    id: problem
    attributes:
      label: 问题或动机
      description: 这个需求是否与某个问题有关？
      placeholder: 当我……时感到很困扰
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望看到的效果。
      placeholder: 如果 Tina 能……就好了
    validations:
      required: true

  - type: dropdown
    id: feature_area
    attributes:
      label: 功能区域
      description: 与设置页中的分组一致。
      options:
        - 基础功能（Essentials）
        - 实用工具（Utilities）
        - 声音（Sound）
        - 能耗与显示（Energy and display）
        - 窗口与程序坞（Windows and Dock）
        - 鼠标与键盘（Mouse and keyboard）
        - 文件（Files）
        - App 管理（App management）
        - App
        - 其他（Other）
    validations:
      required: true

  - type: textarea
    id: open_source
    attributes:
      label: 开源参考（可选）
      description: 如果需求来自开源项目，请写来源仓库、版本/commit，以及 macOS 15、原生实现、上游 Release 体积、复杂度和重复性检查的结论。可直接使用 `/tina-feature-research` 生成。
      placeholder: |
        来源：https://github.com/owner/repo @ <tag/commit>
        结论：pursue / MVP / defer / reject
        macOS 15：pass / conditional / fail
        原生：pass / conditional / fail
        上游 release 体积：X MB / 无 release（跳过）
        Tina 增量体积：约 X MB（依据）
        复杂度：low / medium / high（依据）
        重复性：new / enhancement / duplicate

  - type: textarea
    id: mockups
    attributes:
      label: 草图 / 参考
      description: 可附上草图、截图或参考链接。
