name: "✨ 功能需求"
description: 为 Tina 建议新功能或改进
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        **这个需求可能已经有人提过了。** 提交前请先搜索
        [已有 issue](https://github.com/zbl-jerry/tina/issues?q=is%3Aissue)，
        并在相同的需求下评论、点 👍，而不是再开一个重复的 issue，这样投票会集中在一处。

  - type: textarea
    id: problem
    attributes:
      label: 问题或动机
      description: 这个需求是否与某个问题有关？
      placeholder: 当我……时感到很困扰
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望看到的效果。
      placeholder: 如果 Tina 能……就好了
    validations:
      required: true

  - type: dropdown
    id: feature_area
    attributes:
      label: 功能区域
      description: 与设置页中的分组一致。
      options:
        - 基础功能（Essentials）
        - 实用工具（Utilities）
        - 声音（Sound）
        - 能耗与显示（Energy and display）
        - 窗口与程序坞（Windows and Dock）
        - 鼠标与键盘（Mouse and keyboard）
        - 文件（Files）
        - App 管理（App management）
        - App
        - 其他（Other）
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: 草图 / 参考
      description: 可附上草图、截图或参考链接。
