name: "🐛 Bug 报告"
description: 报告 Tina 中的 Bug 或异常行为
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        请尽量填写，信息不完整也可以提交。

        **一个 issue 只报一个问题。** 在已有讨论里追加第二个问题，很容易在
        第一个问题处理过程中被忽略。

        [如何提交有用的 Bug 报告](https://github.com/zbl-jerry/tina/blob/dev/docs/TROUBLESHOOTING.md#reporting-a-useful-bug)
        列出了让报告可被处理所需的信息。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      description: "[故障排查指南](https://github.com/zbl-jerry/tina/blob/dev/docs/TROUBLESHOOTING.md) 覆盖了下面两项。"
      options:
        - label: "如果功能完全没有反应，我已在「系统设置 → 隐私与安全性」中确认 Tina 已列出并开启了它需要的权限，并试过关闭再重新开启。"
          required: true
        - label: "在最新版本上仍然可以复现。"
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚、简要地描述这个 Bug。
      placeholder: 描述这个 Bug……（期望行为和实际行为）
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 复现该问题的操作步骤。
      placeholder: |
        1. 打开 Tina
        2. 点击「...」
        3. 出现错误
    validations:
      required: true

  - type: dropdown
    id: feature_area
    attributes:
      label: 功能区域
      description: 与设置页中的分组一致。
      options:
        - 基础功能（Essentials）
        - 实用工具（Utilities）
        - 声音（Sound）
        - 能耗与显示（Energy and display）
        - 窗口与程序坞（Windows and Dock）
        - 鼠标与键盘（Mouse and keyboard）
        - 文件（Files）
        - App 管理（App management）
        - App
        - 其他（Other）
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: 如果适用，请附上截图或录屏。

  - type: input
    id: tina_version
    attributes:
      label: Tina 版本
      description: 设置页「关于」中显示的版本号。
      placeholder: 粘贴「关于」页面中的版本号
    validations:
      required: true

  - type: dropdown
    id: macos_version
    attributes:
      label: macOS 版本
      options:
        - macOS 27 (Golden Gate)
        - macOS 26 (Tahoe)
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: 语言
      description: Tina 当前使用的语言；如果与 macOS 系统语言不同，请一并说明。此前有多个 Bug 只在非英语环境下出现，这一项能大幅缩小排查范围。
      placeholder: "简体中文 · macOS 为简体中文"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac 机型与显示器
      description: 仅当该问题与窗口或硬件无关时可以跳过。Mac 机型决定传感器、风扇和亮度范围；显示器和空间布局几乎影响所有窗口问题。
      placeholder: "MacBook Pro 14 (M3 Pro) · 内置屏 + 一台 4K 外接屏，缩放显示，两个空间"

  - type: input
    id: installation_method
    attributes:
      label: 安装方式
      placeholder: Homebrew、DMG、GitHub Release、从源码构建
